<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allAbut 5μm</title>

  <!-- Google Fonts: IBM Plex Sans + IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js v0.160.0 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'IBM Plex Sans',sans-serif; background:#06090f; color:#fff; min-height:100vh; }
    :root { --navy:#001D4A; --gold:#D4AF37; --dark:#06090f; --white:#fff; }

    /* ===== 화면(screen) 공통: 한 번에 하나만 보이고, 페이드로 전환 ===== */
    .screen {
      display: none;
      min-height: 100vh;
      background: var(--dark);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .screen.active  { display: flex; }   /* 지금 화면 */
    .screen.visible { opacity: 1; }      /* 서서히 나타남 */

    /* ===== 로고: all A but 5μm =====
       글자 크기는 모두 .logo 의 font-size(36px) 기준 비율(em)로 정해서,
       .logo-small 을 붙이면 전체가 절반 크기로 줄어들어요. */
    .logo {
      display: inline-flex;
      align-items: baseline;   /* all, A, but, 5μm 의 밑선(baseline)을 똑같이 맞춤 */
      line-height: 1;
      font-size: 36px;
    }
    .logo-small { font-size: 18px; }  /* 로그인 화면용 절반 크기 로고 */

    .logo-all,
    .logo-but {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1em;          /* 36px */
      font-weight: 200;
      color: var(--white);
    }
    .logo-a {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1.3333em;     /* 48px */
      font-weight: 600;
      color: var(--gold);
    }
    .logo-um {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.3056em;     /* 11px */
      color: var(--gold);      /* 5, μ, m 세 글자 모두 같은 골드 */
      letter-spacing: 0;       /* 자간 없음 */
      margin-left: 1px;        /* but 에 바짝 붙이기 */
      position: relative;
      top: -1.7273em;          /* -19px: 윗부분을 but 의 b 윗부분 높이에 맞춤 */
    }

    /* ===== 슬로건 ===== */
    .slogan {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 16px;
    }

    /* ===== 골드 버튼 공통 ===== */
    .cta-btn,
    .gold-btn {
      background: var(--gold);
      color: var(--navy);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: filter 0.2s, opacity 0.2s;
    }
    .cta-btn:hover,
    .gold-btn:hover {
      filter: brightness(1.2);  /* 마우스를 올리면 밝아짐 */
    }
    .gold-btn:disabled {
      opacity: 0.6;
      cursor: default;
      filter: none;
    }

    /* 랜딩의 Start Order 버튼 */
    .cta-btn {
      padding: 14px 40px;
      margin-top: 40px;
    }

    /* ===== 로그인 화면 배경 (아주 은은한 골드 빛) ===== */
    #screen-auth {
      background:
        radial-gradient(circle at 50% 40%, rgba(212,175,55,0.08), transparent 55%),
        var(--dark);
    }

    /* ===== 반투명 유리 패널 ===== */
    .glass-panel {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin-top: 28px;
      padding: 32px 28px 28px;
      background: rgba(12,16,24,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 16px;
      text-align: left;
    }

    /* 네 모서리의 짧은 골드 L자 꺾쇠 */
    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 0 solid var(--gold);
      pointer-events: none;
    }
    .corner.tl { top: 8px;    left: 8px;  border-top-width: 2px;    border-left-width: 2px; }
    .corner.tr { top: 8px;    right: 8px; border-top-width: 2px;    border-right-width: 2px; }
    .corner.bl { bottom: 8px; left: 8px;  border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; }

    /* ===== 탭 (Sign In / Create Account) ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 12px 0;
      color: #8892a4;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab:hover { color: #fff; }
    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);  /* 선택된 탭은 골드 밑줄 */
    }

    /* ===== 입력 칸 ===== */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: var(--gold);  /* 포커스되면 골드 테두리 */
    }

    /* 패널 안 큰 버튼 (Enter / Create) */
    .gold-btn.full {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      font-size: 15px;
    }

    /* ===== 에러 / 안내 메시지 ===== */
    .auth-msg {
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      margin: 4px 0 4px;
    }
    .auth-msg.error { color: #ff6b6b; }       /* 빨간 글씨 */
    .auth-msg.info  { color: var(--gold); }   /* 안내는 골드 글씨 */

    /* ===== ← Back 링크 ===== */
    .back-link {
      margin-top: 24px;
      background: none;
      border: none;
      color: #8892a4;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    /* ===== 테두리 버튼 ===== */
    .outline-btn {
      background: none;
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 8px;
      color: var(--gold);
      padding: 12px 32px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .outline-btn:hover { background: rgba(212,175,55,0.1); }


    /* ================================================================
       Avatar Studio (아바타 꾸미기 화면)
       PC: 왼쪽 3D 미리보기(60%) + 오른쪽 꾸미기 패널(40%)
       모바일: 위 3D 미리보기(45%) + 아래 꾸미기 패널
       ================================================================ */
    #screen-avatar {
      flex-direction: row;
      align-items: stretch;
      justify-content: flex-start;
      padding: 0;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      text-align: left;
    }

    /* 3D 미리보기 영역 (화면의 60%) */
    .studio-preview {
      position: relative;
      flex: 0 0 60%;
      min-width: 0;
      background:
        radial-gradient(circle at 50% 70%, rgba(212,175,55,0.10), transparent 50%),
        radial-gradient(circle at 50% 40%, #0d1320, var(--dark) 70%);
    }
    /* 캔버스는 미리보기 영역을 꽉 채움 */
    #studio-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: pan-y;   /* 손가락 가로 드래그는 회전, 세로는 스크롤 */
    }
    #studio-canvas:active { cursor: grabbing; }
    .studio-hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8892a4;
      opacity: 0.6;
      pointer-events: none;
    }

    /* 꾸미기 패널 (나머지 40%) */
    .studio-panel.glass-panel {
      flex: 1 1 0;
      width: auto;
      max-width: none;
      min-width: 0;
      margin: 20px 20px 20px 0;
      padding: 26px 22px 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      container-type: inline-size;   /* 패널 너비에 따라 탭 배치를 바꾸기 위해 */
    }

    /* 패널 머리말: 제목 + 닉네임 + Sign Out */
    .studio-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .studio-header > div { min-width: 0; }
    .studio-title {
      font-size: 22px;
      font-weight: 200;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .studio-title b { font-weight: 600; color: var(--gold); }
    .studio-nick {
      margin-top: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #8892a4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .studio-nick::before { content: '@'; color: var(--gold); }
    .studio-header .back-link {
      margin-top: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* 카테고리 아이콘 탭: 기본은 5개 + 4개 두 줄 */
    .studio-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    /* 패널이 넓으면 9개 한 줄 */
    @container (min-width: 560px) {
      .studio-tabs { grid-template-columns: repeat(9, 1fr); }
    }
    .studio-tab {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: 0;
      color: var(--gold);
      cursor: pointer;
    }
    .studio-tab-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      opacity: 0.65;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s;
    }
    .studio-tab-icon svg { width: 22px; height: 22px; }
    .studio-tab:hover .studio-tab-icon { opacity: 1; }
    .studio-tab.active .studio-tab-icon {
      opacity: 1;
      background: rgba(212,175,55,0.15);   /* 선택된 탭: 골드 반투명 배경 */
      border-color: var(--gold);           /* + 골드 테두리 */
    }
    .studio-tab-label {
      max-width: 100%;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 9px;
      line-height: 1.2;
      color: #8892a4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .studio-tab.active .studio-tab-label { color: var(--gold); }

    /* 아이템 그리드: 정사각형 카드 3열 (이 부분만 스크롤) */
    .studio-items {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      grid-auto-rows: max-content;
      align-content: start;
      padding: 6px 6px 6px 2px;
    }

    /* 그림 카드 */
    .item-card {
      position: relative;
      aspect-ratio: 1 / 1;
      padding: 0;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .item-card:hover { border-color: rgba(212,175,55,0.45); }
    .item-card.selected {
      border: 2px solid var(--gold);                 /* 골드 테두리 */
      background: rgba(212,175,55,0.06);
      box-shadow: 0 0 16px rgba(212,175,55,0.28);    /* 은은한 골드 빛 */
    }
    .item-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 11px;
      transition: opacity 0.25s;
    }
    /* 미리보기 그림을 만드는 중 */
    .item-card.loading img { opacity: 0; }
    .item-card.loading::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border: 2px solid rgba(212,175,55,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: studio-spin 0.8s linear infinite;
    }
    @keyframes studio-spin { to { transform: rotate(360deg); } }

    /* 색상 아이템: 오른쪽 아래 동그란 색 칩 */
    .color-dot {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* 잠긴 아이템 */
    .item-card.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .lock-icon {
      position: absolute;
      left: 8px;
      bottom: 6px;
      font-size: 13px;
    }

    /* 가격 뱃지 (오른쪽 위) */
    .price-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--gold);
      color: var(--navy);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 999px;
    }

    /* 하단 버튼 2개 (패널 맨 아래 고정) */
    .studio-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .studio-actions .outline-btn { flex: 0 0 auto; padding: 0 18px; height: 48px; white-space: nowrap; }
    .studio-actions .gold-btn    { flex: 1; height: 48px; font-size: 15px; white-space: nowrap; }
    #studio-error { flex-shrink: 0; }

    /* Avatar Studio 화면에서는 하단 저작권 문구 숨김 (버튼과 겹치지 않게) */
    body:has(#screen-avatar.active) .footer { display: none; }

    /* ----- 모바일 (폭 768px 이하): 위아래 분할 ----- */
    @media (max-width: 768px) {
      #screen-avatar {
        flex-direction: column;
        height: 100vh;
        height: 100dvh;   /* 모바일 주소창 높이를 뺀 실제 화면 높이 */
      }
      .studio-preview {
        flex: 0 0 45%;    /* 위 45%: 3D 미리보기 */
      }
      .studio-hint { bottom: 22px; }
      .studio-panel.glass-panel {
        flex: 1 1 0;      /* 아래 나머지: 꾸미기 패널 (아이템 부분만 스크롤) */
        margin: -12px 10px 10px;
        padding: 18px 14px 14px;
      }
      .studio-header { margin-bottom: 12px; }
      .studio-title { font-size: 19px; }
      .studio-tabs { gap: 4px; padding-bottom: 10px; margin-bottom: 10px; }
      .studio-tab-icon { width: 38px; height: 38px; }
      .studio-tab-icon svg { width: 20px; height: 20px; }
      .studio-items { gap: 8px; }
    }


    /* ================================================================
       로그인 세션 (남은 시간 표시 / 5분 경고 팝업 / 만료 안내)
       ================================================================ */

    /* 남은 시간 표시: 시계 아이콘 + 52:13 + [+1h] */
    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      white-space: nowrap;
    }
    .session-badge svg { width: 13px; height: 13px; flex-shrink: 0; }
    .session-time { min-width: 38px; }
    .session-time.warn { color: #ff9f43; }          /* 10분 이하: 주황 */
    .session-time.danger {                          /* 5분 이하: 빨강 + 천천히 깜빡임 */
      color: #ff5c5c;
      animation: session-blink 1.6s ease-in-out infinite;
    }
    @keyframes session-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .session-extend {
      background: none;
      border: 1px solid rgba(212,175,55,0.6);
      border-radius: 999px;
      color: var(--gold);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .session-extend:hover { background: rgba(212,175,55,0.12); }
    .session-extend:disabled { cursor: default; }

    /* Avatar Studio 머리말 오른쪽: 남은 시간 + Sign Out */
    .studio-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .studio-header-right .back-link { margin-top: 0; }


    /* 5분 경고 팝업 */
    .session-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(3,5,10,0.6);   /* 배경 살짝 어둡게 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .session-modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .session-modal .glass-panel {
      max-width: 360px;
      margin-top: 0;
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.3s ease;
    }
    .session-modal.open .glass-panel { transform: scale(1); }
    .session-modal-title {
      font-size: 18px;
      font-weight: 600;
    }
    .session-modal-text {
      margin-top: 8px;
      font-size: 13px;
      color: #8892a4;
    }
    .session-modal-countdown {
      margin: 18px 0 22px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 40px;
      font-weight: 300;
      color: #ff5c5c;
      letter-spacing: 2px;
    }
    .session-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .session-modal-actions .gold-btn,
    .session-modal-actions .outline-btn {
      width: 100%;
      height: 48px;
      font-size: 15px;
    }

    /* 랜딩 화면 안내 문구 (Session expired...) */
    .landing-notice {
      position: fixed;
      top: 28px;
      left: 50%;
      z-index: 150;
      transform: translate(-50%, -10px);
      max-width: calc(100% - 32px);
      padding: 12px 20px;
      background: rgba(12,16,24,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 10px;
      color: var(--gold);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .landing-notice.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }


    /* ================================================================
       월드 화면 (방콕 골목 + allAbut 체험관)
       ================================================================ */
    #screen-world {
      position: relative;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: #06090f;
    }
    #world-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;   /* 손가락 드래그/핀치는 월드 조작에 사용 */
    }

    /* 왼쪽 위: 작은 로고 + 현재 위치 */
    .world-location {
      position: absolute;
      top: 18px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      pointer-events: none;
      text-align: left;
    }
    .world-location .logo { text-shadow: 0 1px 6px rgba(0,0,0,0.5); }
    #world-location-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    /* 오른쪽 위 메뉴 */
    .world-topbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(12,16,24,0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 12px;
    }
    .world-topbar-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    #world-nickname {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #e8ebf1;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #world-nickname::before { content: '@'; color: var(--gold); }
    .topbar-link {
      background: none;
      border: none;
      color: #8892a4;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .topbar-link:hover { color: var(--gold); }

    /* 오른쪽 아래: 원형 미니맵 */
    #world-minimap {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      box-shadow: 0 4px 18px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    /* 하단 안내 (처음 골목에 왔을 때) */
    .world-hint {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translate(-50%, 10px);
      padding: 10px 18px;
      background: rgba(12,16,24,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 999px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--gold);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s, transform 0.5s;
    }
    .world-hint.show { opacity: 1; transform: translate(-50%, 0); }

    /* 마우스 툴팁 ("Enter allAbut") */
    .world-tooltip {
      position: absolute;
      padding: 6px 10px;
      background: rgba(11,35,80,0.92);
      border: 1px solid var(--gold);
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .world-tooltip.show { opacity: 1; }

    /* 3D 위치에 붙는 말풍선 (BTS 역) */
    .world-bubble {
      position: absolute;
      transform: translate(-50%, calc(-100% - 12px));
      padding: 9px 14px;
      background: #ffffff;
      color: #0b2350;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .world-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -7px;
      margin-left: -7px;
      border: 7px solid transparent;
      border-bottom: 0;
      border-top-color: #ffffff;
    }
    .world-bubble.show { opacity: 1; }

    /* 하단 대화창 (데스크 NPC) */
    .world-dialog.glass-panel {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: calc(100% - 32px);
      max-width: 640px;
      margin: 0;
      padding: 18px 44px 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .world-dialog.glass-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    #world-dialog-name {
      flex-shrink: 0;
      min-width: 64px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
    }
    #world-dialog-text {
      font-size: 15px;
      line-height: 1.55;
      color: #e8ebf1;
    }
    .world-dialog-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #8892a4;
      font-size: 14px;
      cursor: pointer;
    }
    .world-dialog-close:hover { color: var(--gold); }

    /* 장면 전환 페이드 (검정) */
    .world-fade {
      position: absolute;
      inset: 0;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* 월드 화면에서는 하단 저작권 문구 숨김 */
    body:has(#screen-world.active) .footer { display: none; }

    /* ----- 모바일 ----- */
    @media (max-width: 640px) {
      .world-location { top: 14px; left: 14px; }
      .world-topbar { top: 10px; right: 10px; padding: 8px 10px; }
      .world-topbar-row { gap: 10px; }
      #world-nickname { max-width: 90px; }
      #world-minimap { width: 112px; height: 112px; right: 10px; bottom: 10px; }
      .world-hint { bottom: 136px; font-size: 11px; }
      .world-dialog.glass-panel { bottom: 132px; width: calc(100% - 20px); flex-direction: column; align-items: flex-start; gap: 6px; }
    }


    /* ===== 하단 저작권 문구 (화면 아래 고정) ===== */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      opacity: 0.2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- ========== 1. 랜딩 화면 ========== -->
    <section class="screen" id="screen-landing">

      <!-- 로고 -->
      <div class="logo">
        <span class="logo-all">all</span>
        <span class="logo-a">A</span>
        <span class="logo-but">but</span>
        <span class="logo-um">5μm</span>
      </div>

      <!-- 슬로건 -->
      <p class="slogan">Precision Custom Abutment</p>

      <!-- 주문 시작 버튼 -->
      <button class="cta-btn" onclick="goStep(1)">Start Order</button>

    </section>


    <!-- ========== 2. 로그인 / 회원가입 화면 ========== -->
    <section class="screen" id="screen-auth">

      <!-- 작은 로고 (랜딩 로고의 절반 크기) -->
      <div class="logo logo-small">
        <span class="logo-all">all</span>
        <span class="logo-a">A</span>
        <span class="logo-but">but</span>
        <span class="logo-um">5μm</span>
      </div>

      <!-- 유리 패널 -->
      <div class="glass-panel">
        <!-- 네 모서리 꺾쇠 -->
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- 탭 -->
        <div class="tabs">
          <button type="button" class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
          <button type="button" class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- Sign In 폼 -->
        <form id="form-signin" onsubmit="handleSignIn(event)" novalidate>
          <div class="field">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" autocomplete="current-password">
          </div>
          <p class="auth-msg" id="signin-error"></p>
          <button type="submit" class="gold-btn full" id="signin-btn">Enter</button>
        </form>

        <!-- Create Account 폼 -->
        <form id="form-signup" onsubmit="handleSignUp(event)" novalidate style="display:none">
          <div class="field">
            <label for="signup-nickname">Nickname</label>
            <input type="text" id="signup-nickname" autocomplete="nickname">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="signup-password2">Confirm Password</label>
            <input type="password" id="signup-password2" autocomplete="new-password">
          </div>
          <p class="auth-msg" id="signup-error"></p>
          <button type="submit" class="gold-btn full" id="signup-btn">Create</button>
        </form>
      </div>

      <!-- 랜딩으로 돌아가기 -->
      <button class="back-link" onclick="showScreen('landing')">← Back</button>

    </section>


    <!-- ========== 3. Avatar Studio (아바타 꾸미기) ========== -->
    <section class="screen" id="screen-avatar">

      <!-- 왼쪽(모바일은 위): 3D 미리보기 -->
      <div class="studio-preview" id="studio-preview">
        <canvas id="studio-canvas"></canvas>
        <p class="studio-hint">Drag to rotate</p>
      </div>

      <!-- 오른쪽(모바일은 아래): 꾸미기 패널 -->
      <div class="studio-panel glass-panel">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="studio-header">
          <div>
            <h2 class="studio-title">Avatar <b>Studio</b></h2>
            <p class="studio-nick" id="studio-nickname"></p>
          </div>
          <div class="studio-header-right">
            <!-- 남은 세션 시간 (session.js 가 1초마다 갱신) -->
            <div class="session-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span class="session-time">--:--</span>
              <button type="button" class="session-extend" onclick="handleExtendClick(this)">+1h</button>
            </div>
            <button class="back-link" onclick="endSession('manual')">Sign Out</button>
          </div>
        </div>

        <!-- 카테고리 아이콘 탭 (avatar-studio.js 가 채워요) -->
        <div class="studio-tabs" id="studio-tabs"></div>

        <!-- 아이템 그림 카드 (avatar-studio.js 가 채워요) -->
        <div class="studio-items" id="studio-items"></div>

        <p class="auth-msg" id="studio-error"></p>

        <div class="studio-actions">
          <button type="button" class="outline-btn" onclick="randomizeAvatar()">🎲 Random</button>
          <button type="button" class="gold-btn" id="studio-save-btn" onclick="saveAvatar()">Save &amp; Enter →</button>
        </div>
      </div>

    </section>


    <!-- ========== 4. 월드 (방콕 골목 + allAbut 체험관) ========== -->
    <section class="screen" id="screen-world">
      <canvas id="world-canvas"></canvas>

      <!-- 왼쪽 위: 작은 로고 + 현재 위치 이름 -->
      <div class="world-location">
        <div class="logo logo-small">
          <span class="logo-all">all</span>
          <span class="logo-a">A</span>
          <span class="logo-but">but</span>
          <span class="logo-um">5μm</span>
        </div>
        <span id="world-location-name"></span>
      </div>

      <!-- 오른쪽 위: 세션 타이머 / 닉네임 / Edit Avatar / Sign Out -->
      <div class="world-topbar">
        <div class="world-topbar-row">
          <span id="world-nickname"></span>
          <div class="session-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span class="session-time">--:--</span>
            <button type="button" class="session-extend" onclick="handleExtendClick(this)">+1h</button>
          </div>
        </div>
        <div class="world-topbar-row">
          <button type="button" class="topbar-link" onclick="editAvatar()">Edit Avatar</button>
          <button type="button" class="topbar-link" onclick="endSession('manual')">Sign Out</button>
        </div>
      </div>

      <!-- 오른쪽 아래: 원형 미니맵 -->
      <canvas id="world-minimap"></canvas>

      <!-- 안내 / 툴팁 / 말풍선 -->
      <div class="world-hint" id="world-hint"></div>
      <div class="world-tooltip" id="world-tooltip"></div>
      <div class="world-bubble" id="world-bubble"></div>

      <!-- 하단 대화창 (데스크 NPC) -->
      <div class="world-dialog glass-panel" id="world-dialog">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <span id="world-dialog-name"></span>
        <p id="world-dialog-text"></p>
        <button type="button" class="world-dialog-close" onclick="hideWorldDialog()" aria-label="Close">✕</button>
      </div>

      <!-- 장면 전환 페이드 -->
      <div class="world-fade" id="world-fade"></div>
    </section>


    <!-- ========== 5분 경고 팝업 ========== -->
    <div class="session-modal" id="session-modal" role="dialog" aria-modal="true" aria-labelledby="session-modal-title">
      <div class="glass-panel">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <h3 class="session-modal-title" id="session-modal-title">Session ending soon</h3>
        <p class="session-modal-text">You will be signed out in</p>
        <p class="session-modal-countdown" id="session-modal-countdown">05:00</p>

        <div class="session-modal-actions">
          <button type="button" class="gold-btn" onclick="handleModalExtend()">Extend 1 hour</button>
          <button type="button" class="outline-btn" onclick="endSession('manual')">Sign out</button>
        </div>
      </div>
    </div>

    <!-- 랜딩 안내 문구 (세션 만료 시 3초간 표시) -->
    <div class="landing-notice" id="landing-notice" role="status"></div>


    <!-- 하단 저작권 -->
    <footer class="footer">© 2026 allAbut. All rights reserved.</footer>

  </div>

  <script src="config.js"></script>
  <script src="lang.js"></script>
  <script src="auth.js"></script>
  <script src="session.js"></script>
  <script src="avatar-catalog.js"></script>
  <script src="avatar.js"></script>
  <script src="avatar-studio.js"></script>
  <script src="world/builders.js"></script>
  <script src="world/zones/bangkok-soi.js"></script>
  <script src="world/player.js"></script>
  <script src="world/zone.js"></script>
  <script src="world/interiors/allabut-shop.js"></script>
  <script src="world/scene-manager.js"></script>
  <script src="app.js"></script>
</body>
</html>
