<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allAbut 5μm</title>
  <meta name="description" content="allAbut — Precision CNC custom abutment ordering">

  <!-- Google Fonts: IBM Plex Sans (본문) + IBM Plex Mono (숫자·주문번호·라벨) -->
  <!-- 태국어·아랍어·페르시아어 글자는 IBM Plex Sans Thai / Arabic 로 보완해요 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@200;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">

  <!-- Supabase JS v2 (버전 고정) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <!-- 화면 스타일: 랜딩·로그인(다크) / 앱(밝은 테마) -->
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">

    <!-- ========== 1. 랜딩 화면 (다크 + 골드 로고) ========== -->
    <section class="screen screen-dark" id="screen-landing">

      <!-- 언어 선택 -->
      <label class="public-lang">
        <span aria-hidden="true">🌐</span>
        <span class="sr-only" data-i18n="language">Language</span>
        <select onchange="setLang(this.value)"></select>
      </label>

      <!-- 로고 -->
      <div class="logo" aria-label="allAbut 5μm">
        <span class="logo-all">all</span><span class="logo-a">A</span><span class="logo-but">but</span><span class="logo-um">5μm</span>
      </div>

      <!-- 슬로건 -->
      <p class="slogan" data-i18n="slogan">Precision Custom Abutment</p>

      <!-- 주문 시작 버튼 -->
      <button type="button" class="cta-btn" onclick="handleStartOrder()" data-i18n="start_order">Start Order</button>

    </section>


    <!-- ========== 2. 로그인 / 회원가입 화면 ========== -->
    <section class="screen screen-dark" id="screen-auth">

      <label class="public-lang">
        <span aria-hidden="true">🌐</span>
        <span class="sr-only" data-i18n="language">Language</span>
        <select onchange="setLang(this.value)"></select>
      </label>

      <!-- 작은 로고 (랜딩 로고의 절반 크기) -->
      <div class="logo logo-small" aria-label="allAbut 5μm">
        <span class="logo-all">all</span><span class="logo-a">A</span><span class="logo-but">but</span><span class="logo-um">5μm</span>
      </div>

      <!-- 흰색 카드 -->
      <div class="auth-card">

        <!-- 탭 -->
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" id="tab-signin" role="tab" aria-selected="true" onclick="switchTab('signin')" data-i18n="tab_sign_in">Sign In</button>
          <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false" onclick="switchTab('signup')" data-i18n="tab_create_account">Create Account</button>
        </div>

        <!-- Sign In 폼 -->
        <form id="form-signin" onsubmit="handleSignIn(event)" novalidate>
          <div class="auth-field">
            <label for="signin-email" data-i18n="email_label">Email</label>
            <input type="email" id="signin-email" autocomplete="email">
          </div>
          <div class="auth-field">
            <label for="signin-password" data-i18n="password_label">Password</label>
            <input type="password" id="signin-password" autocomplete="current-password">
          </div>
          <p class="auth-msg" id="signin-error" role="alert"></p>
          <button type="submit" class="auth-submit" id="signin-btn" data-i18n="btn_sign_in">Sign In</button>
        </form>

        <!-- Create Account 폼 -->
        <form id="form-signup" onsubmit="handleSignUp(event)" novalidate style="display:none">
          <div class="auth-field">
            <label for="signup-nickname" data-i18n="nickname_label">Nickname</label>
            <input type="text" id="signup-nickname" autocomplete="nickname" maxlength="40">
          </div>
          <div class="auth-field">
            <label for="signup-email" data-i18n="email_label">Email</label>
            <input type="email" id="signup-email" autocomplete="email">
          </div>
          <div class="auth-field">
            <label for="signup-password" data-i18n="password_label">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password">
          </div>
          <div class="auth-field">
            <label for="signup-password2" data-i18n="password_confirm_label">Confirm Password</label>
            <input type="password" id="signup-password2" autocomplete="new-password">
          </div>
          <div class="auth-field">
            <label for="signup-clinic"><span data-i18n="clinic_name">Clinic name</span> <span class="auth-optional">(<span data-i18n="optional">optional</span>)</span></label>
            <input type="text" id="signup-clinic" autocomplete="organization" maxlength="200">
          </div>
          <div class="auth-field">
            <label for="signup-phone"><span data-i18n="phone_label">Phone</span> <span class="auth-optional">(<span data-i18n="optional">optional</span>)</span></label>
            <input type="tel" id="signup-phone" autocomplete="tel" maxlength="30">
          </div>
          <p class="auth-msg" id="signup-error" role="alert"></p>
          <button type="submit" class="auth-submit" id="signup-btn" data-i18n="btn_create_account">Create Account</button>
        </form>
      </div>

      <!-- 랜딩으로 돌아가기 -->
      <button type="button" class="back-link" onclick="showScreen('landing')"><span class="arrow" aria-hidden="true">←</span> <span data-i18n="btn_back">Back</span></button>

    </section>


    <!-- ========== 3. 앱 화면 (로그인 후, 밝은 테마) ========== -->
    <section class="screen screen-app" id="screen-app">
      <header class="app-header" id="app-header"></header>
      <main class="app-main" id="app-main" tabindex="-1"></main>
      <nav class="app-tabbar" id="app-tabbar" aria-label="Main"></nav>
    </section>


    <!-- ========== 5분 경고 팝업 ========== -->
    <div class="session-modal" id="session-modal" role="dialog" aria-modal="true" aria-labelledby="session-modal-title">
      <div class="session-card">
        <h3 class="session-modal-title" id="session-modal-title" data-i18n="session_ending_title">Session ending soon</h3>
        <p class="session-modal-text" data-i18n="session_ending_text">You will be signed out in</p>
        <p class="session-modal-countdown mono" id="session-modal-countdown">05:00</p>
        <div class="session-modal-actions">
          <button type="button" class="btn btn-primary btn-lg" onclick="handleModalExtend()" data-i18n="session_extend_btn">Extend 1 hour</button>
          <button type="button" class="btn btn-outline btn-lg" onclick="endSession('manual')" data-i18n="sign_out">Sign Out</button>
        </div>
      </div>
    </div>

    <!-- 랜딩 안내 문구 (세션 만료 시 3초간 표시) -->
    <div class="landing-notice" id="landing-notice" role="status"></div>

    <!-- 토스트 · 모달이 들어갈 자리 -->
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>

    <!-- 하단 저작권 (랜딩·로그인 화면) -->
    <footer class="footer">© 2026 allAbut. All rights reserved.</footer>

  </div>

  <!-- 설정 · 언어 -->
  <script src="config.js"></script>
  <script src="lang/lang-en.js"></script>
  <script src="lang/lang-ko.js"></script>
  <script src="lang/lang-th.js"></script>
  <script src="lang/lang-zh.js"></script>
  <script src="lang/lang-vi.js"></script>
  <script src="lang/lang-es.js"></script>
  <script src="lang/lang-tr.js"></script>
  <script src="lang/lang-ar.js"></script>
  <script src="lang/lang-fa.js"></script>
  <script src="lang.js"></script>

  <!-- 로그인 · 세션 -->
  <script src="auth.js"></script>
  <script src="session.js"></script>

  <!-- CNC 주문 (데이터 · 로직 · 파일 뷰어) — Three.js 는 뷰어를 열 때만 불러와요 -->
  <script src="cnc/cnc-data.js"></script>
  <script src="cnc/cnc-core.js"></script>
  <script src="cnc/cnc-viewer.js"></script>

  <!-- 화면 -->
  <script src="ui/layout.js"></script>
  <script src="ui/page-home.js"></script>
  <script src="ui/page-new.js"></script>
  <script src="ui/page-orders.js"></script>
  <script src="ui/page-profile.js"></script>
  <script src="ui/router.js"></script>

  <!-- 시작 -->
  <script src="app.js"></script>
</body>
</html>
