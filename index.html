<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allAbut 5μm</title>

  <!-- Google Fonts: IBM Plex Sans + IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js v0.160.0 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'IBM Plex Sans',sans-serif; background:#06090f; color:#fff; min-height:100vh; }
    :root { --navy:#001D4A; --gold:#D4AF37; --dark:#06090f; --white:#fff; }

    /* ===== 화면(screen) 공통: 한 번에 하나만 보이고, 페이드로 전환 ===== */
    .screen {
      display: none;
      min-height: 100vh;
      background: var(--dark);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .screen.active  { display: flex; }   /* 지금 화면 */
    .screen.visible { opacity: 1; }      /* 서서히 나타남 */

    /* ===== 로고: all A but 5μm =====
       글자 크기는 모두 .logo 의 font-size(36px) 기준 비율(em)로 정해서,
       .logo-small 을 붙이면 전체가 절반 크기로 줄어들어요. */
    .logo {
      display: inline-flex;
      align-items: baseline;   /* all, A, but, 5μm 의 밑선(baseline)을 똑같이 맞춤 */
      line-height: 1;
      font-size: 36px;
    }
    .logo-small { font-size: 18px; }  /* 로그인 화면용 절반 크기 로고 */

    .logo-all,
    .logo-but {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1em;          /* 36px */
      font-weight: 200;
      color: var(--white);
    }
    .logo-a {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1.3333em;     /* 48px */
      font-weight: 600;
      color: var(--gold);
    }
    .logo-um {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.3056em;     /* 11px */
      color: var(--gold);      /* 5, μ, m 세 글자 모두 같은 골드 */
      letter-spacing: 0;       /* 자간 없음 */
      margin-left: 1px;        /* but 에 바짝 붙이기 */
      position: relative;
      top: -1.7273em;          /* -19px: 윗부분을 but 의 b 윗부분 높이에 맞춤 */
    }

    /* ===== 슬로건 ===== */
    .slogan {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 16px;
    }

    /* ===== 골드 버튼 공통 ===== */
    .cta-btn,
    .gold-btn {
      background: var(--gold);
      color: var(--navy);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: filter 0.2s, opacity 0.2s;
    }
    .cta-btn:hover,
    .gold-btn:hover {
      filter: brightness(1.2);  /* 마우스를 올리면 밝아짐 */
    }
    .gold-btn:disabled {
      opacity: 0.6;
      cursor: default;
      filter: none;
    }

    /* 랜딩의 Start Order 버튼 */
    .cta-btn {
      padding: 14px 40px;
      margin-top: 40px;
    }

    /* ===== 로그인 화면 배경 (아주 은은한 골드 빛) ===== */
    #screen-auth {
      background:
        radial-gradient(circle at 50% 40%, rgba(212,175,55,0.08), transparent 55%),
        var(--dark);
    }

    /* ===== 반투명 유리 패널 ===== */
    .glass-panel {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin-top: 28px;
      padding: 32px 28px 28px;
      background: rgba(12,16,24,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 16px;
      text-align: left;
    }

    /* 네 모서리의 짧은 골드 L자 꺾쇠 */
    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 0 solid var(--gold);
      pointer-events: none;
    }
    .corner.tl { top: 8px;    left: 8px;  border-top-width: 2px;    border-left-width: 2px; }
    .corner.tr { top: 8px;    right: 8px; border-top-width: 2px;    border-right-width: 2px; }
    .corner.bl { bottom: 8px; left: 8px;  border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; }

    /* ===== 탭 (Sign In / Create Account) ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 12px 0;
      color: #8892a4;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab:hover { color: #fff; }
    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);  /* 선택된 탭은 골드 밑줄 */
    }

    /* ===== 입력 칸 ===== */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: var(--gold);  /* 포커스되면 골드 테두리 */
    }

    /* 패널 안 큰 버튼 (Enter / Create) */
    .gold-btn.full {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      font-size: 15px;
    }

    /* ===== 에러 / 안내 메시지 ===== */
    .auth-msg {
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      margin: 4px 0 4px;
    }
    .auth-msg.error { color: #ff6b6b; }       /* 빨간 글씨 */
    .auth-msg.info  { color: var(--gold); }   /* 안내는 골드 글씨 */

    /* ===== ← Back 링크 ===== */
    .back-link {
      margin-top: 24px;
      background: none;
      border: none;
      color: #8892a4;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    /* ===== 준비 중 화면 (Shop) ===== */
    .coming-soon {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .shop-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .outline-btn {
      background: none;
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 8px;
      color: var(--gold);
      padding: 12px 32px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .outline-btn:hover { background: rgba(212,175,55,0.1); }


    /* ================================================================
       Avatar Studio (아바타 꾸미기 화면)
       PC: 왼쪽 3D 미리보기 + 오른쪽 꾸미기 패널
       모바일: 위 3D 미리보기 + 아래 꾸미기 패널
       ================================================================ */
    #screen-avatar {
      flex-direction: row;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      height: 100vh;
      text-align: left;
    }

    /* 3D 미리보기 영역 */
    .studio-preview {
      position: relative;
      flex: 1;
      min-width: 0;
      background:
        radial-gradient(circle at 50% 70%, rgba(212,175,55,0.10), transparent 50%),
        radial-gradient(circle at 50% 40%, #0d1320, var(--dark) 70%);
    }
    #studio-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: pan-y;   /* 손가락 가로 드래그는 회전, 세로는 스크롤 */
    }
    #studio-canvas:active { cursor: grabbing; }
    .studio-hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8892a4;
      opacity: 0.6;
      pointer-events: none;
    }

    /* 꾸미기 패널 (유리 패널 재사용) */
    .studio-panel.glass-panel {
      width: 420px;
      max-width: none;
      flex-shrink: 0;
      margin: 24px 24px 24px 0;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 패널 머리말: 제목 + 닉네임 + Sign Out */
    .studio-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .studio-title {
      font-size: 22px;
      font-weight: 200;
      letter-spacing: 0.5px;
    }
    .studio-title b { font-weight: 600; color: var(--gold); }
    .studio-nick {
      margin-top: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #8892a4;
    }
    .studio-nick::before { content: '@'; color: var(--gold); }
    .studio-header .back-link { margin-top: 4px; }

    /* 카테고리 탭 (가로 스크롤) */
    .studio-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .studio-tabs::-webkit-scrollbar { display: none; }
    .studio-tab {
      flex-shrink: 0;
      background: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 7px 14px;
      color: #8892a4;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .studio-tab:hover { color: #fff; }
    .studio-tab.active {
      color: var(--gold);
      border-color: rgba(212,175,55,0.5);
      background: rgba(212,175,55,0.08);
    }

    /* 아이템 그리드 */
    .studio-items {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      gap: 10px;
      align-content: start;
      padding: 4px 2px;
    }
    .studio-items.cards  { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .studio-items.colors { grid-template-columns: repeat(auto-fill, 52px); gap: 14px; }

    /* 이름 카드 */
    .item-card {
      position: relative;
      height: 56px;
      padding: 0 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #d5dae3;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .item-card:hover { border-color: rgba(212,175,55,0.4); }
    .item-card.selected {
      border: 2px solid var(--gold);   /* 선택된 아이템은 골드 테두리 */
      background: rgba(212,175,55,0.08);
      color: #fff;
    }

    /* 동그란 색 칩 */
    .color-chip {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }
    .color-chip:hover { transform: scale(1.06); }
    .color-chip.selected {
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
    }

    /* 잠긴 아이템 */
    .item-card.locked,
    .color-chip.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .lock-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
    }
    .item-card .lock-icon { left: auto; right: 6px; top: auto; bottom: 4px; transform: none; font-size: 11px; }

    /* 가격 뱃지 (오른쪽 위) */
    .price-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--gold);
      color: var(--navy);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 999px;
    }

    /* 하단 버튼 2개 */
    .studio-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-shrink: 0;
    }
    .studio-actions .outline-btn { flex: 0 0 auto; padding: 0 18px; height: 48px; }
    .studio-actions .gold-btn    { flex: 1; height: 48px; font-size: 15px; }

    /* Avatar Studio 화면에서는 하단 저작권 문구 숨김 (버튼과 겹치지 않게) */
    body:has(#screen-avatar.active) .footer { display: none; }

    /* ----- 모바일: 위아래 분할 ----- */
    @media (max-width: 768px) {
      #screen-avatar {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }
      .studio-preview {
        flex: none;
        height: 45vh;
      }
      .studio-panel.glass-panel {
        width: auto;
        margin: -16px 12px 12px;
        padding: 22px 16px 16px;
      }
      .studio-items { max-height: 38vh; }
    }


    /* ===== 하단 저작권 문구 (화면 아래 고정) ===== */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      opacity: 0.2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- ========== 1. 랜딩 화면 ========== -->
    <section class="screen" id="screen-landing">

      <!-- 로고 -->
      <div class="logo">
        <span class="logo-all">all</span>
        <span class="logo-a">A</span>
        <span class="logo-but">but</span>
        <span class="logo-um">5μm</span>
      </div>

      <!-- 슬로건 -->
      <p class="slogan">Precision Custom Abutment</p>

      <!-- 주문 시작 버튼 -->
      <button class="cta-btn" onclick="goStep(1)">Start Order</button>

    </section>


    <!-- ========== 2. 로그인 / 회원가입 화면 ========== -->
    <section class="screen" id="screen-auth">

      <!-- 작은 로고 (랜딩 로고의 절반 크기) -->
      <div class="logo logo-small">
        <span class="logo-all">all</span>
        <span class="logo-a">A</span>
        <span class="logo-but">but</span>
        <span class="logo-um">5μm</span>
      </div>

      <!-- 유리 패널 -->
      <div class="glass-panel">
        <!-- 네 모서리 꺾쇠 -->
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- 탭 -->
        <div class="tabs">
          <button type="button" class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
          <button type="button" class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- Sign In 폼 -->
        <form id="form-signin" onsubmit="handleSignIn(event)" novalidate>
          <div class="field">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" autocomplete="current-password">
          </div>
          <p class="auth-msg" id="signin-error"></p>
          <button type="submit" class="gold-btn full" id="signin-btn">Enter</button>
        </form>

        <!-- Create Account 폼 -->
        <form id="form-signup" onsubmit="handleSignUp(event)" novalidate style="display:none">
          <div class="field">
            <label for="signup-nickname">Nickname</label>
            <input type="text" id="signup-nickname" autocomplete="nickname">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="signup-password2">Confirm Password</label>
            <input type="password" id="signup-password2" autocomplete="new-password">
          </div>
          <p class="auth-msg" id="signup-error"></p>
          <button type="submit" class="gold-btn full" id="signup-btn">Create</button>
        </form>
      </div>

      <!-- 랜딩으로 돌아가기 -->
      <button class="back-link" onclick="showScreen('landing')">← Back</button>

    </section>


    <!-- ========== 3. Avatar Studio (아바타 꾸미기) ========== -->
    <section class="screen" id="screen-avatar">

      <!-- 왼쪽(모바일은 위): 3D 미리보기 -->
      <div class="studio-preview" id="studio-preview">
        <canvas id="studio-canvas"></canvas>
        <p class="studio-hint">Drag to rotate</p>
      </div>

      <!-- 오른쪽(모바일은 아래): 꾸미기 패널 -->
      <div class="studio-panel glass-panel">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="studio-header">
          <div>
            <h2 class="studio-title">Avatar <b>Studio</b></h2>
            <p class="studio-nick" id="studio-nickname"></p>
          </div>
          <button class="back-link" onclick="handleSignOut()">Sign Out</button>
        </div>

        <!-- 카테고리 탭 (avatar-studio.js 가 채워요) -->
        <div class="studio-tabs" id="studio-tabs"></div>

        <!-- 아이템 그리드 (avatar-studio.js 가 채워요) -->
        <div class="studio-items" id="studio-items"></div>

        <p class="auth-msg" id="studio-error"></p>

        <div class="studio-actions">
          <button type="button" class="outline-btn" onclick="randomizeAvatar()">🎲 Random</button>
          <button type="button" class="gold-btn" id="studio-save-btn" onclick="saveAvatar()">Save &amp; Enter →</button>
        </div>
      </div>

    </section>


    <!-- ========== 4. 매장 화면 (준비 중) ========== -->
    <section class="screen" id="screen-shop">
      <p class="coming-soon">Shop — coming soon</p>
      <div class="shop-actions">
        <button class="outline-btn" onclick="editAvatar()">Edit Avatar</button>
        <button class="outline-btn" onclick="handleSignOut()">Sign Out</button>
      </div>
    </section>


    <!-- 하단 저작권 -->
    <footer class="footer">© 2026 allAbut. All rights reserved.</footer>

  </div>

  <script src="config.js"></script>
  <script src="lang.js"></script>
  <script src="auth.js"></script>
  <script src="avatar-catalog.js"></script>
  <script src="avatar.js"></script>
  <script src="avatar-studio.js"></script>
  <script src="app.js"></script>
</body>
</html>
