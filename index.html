<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allAbut 5μm</title>

  <!-- Google Fonts: IBM Plex Sans + IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'IBM Plex Sans',sans-serif; background:#06090f; color:#fff; min-height:100vh; }
    :root { --navy:#001D4A; --gold:#D4AF37; --dark:#06090f; --white:#fff; }

    /* ===== 화면(screen) 공통: 한 번에 하나만 보이고, 페이드로 전환 ===== */
    .screen {
      display: none;
      min-height: 100vh;
      background: var(--dark);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .screen.active  { display: flex; }   /* 지금 화면 */
    .screen.visible { opacity: 1; }      /* 서서히 나타남 */

    /* ===== 로고: all A but 5μm =====
       글자 크기는 모두 .logo 의 font-size(36px) 기준 비율(em)로 정해서,
       .logo-small 을 붙이면 전체가 절반 크기로 줄어들어요. */
    .logo {
      display: inline-flex;
      align-items: baseline;   /* all, A, but, 5μm 의 밑선(baseline)을 똑같이 맞춤 */
      line-height: 1;
      font-size: 36px;
    }
    .logo-small { font-size: 18px; }  /* 로그인 화면용 절반 크기 로고 */

    .logo-all,
    .logo-but {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1em;          /* 36px */
      font-weight: 200;
      color: var(--white);
    }
    .logo-a {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1.3333em;     /* 48px */
      font-weight: 600;
      color: var(--gold);
    }
    .logo-um {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.3056em;     /* 11px */
      color: var(--gold);      /* 5, μ, m 세 글자 모두 같은 골드 */
      letter-spacing: 0;       /* 자간 없음 */
      margin-left: 1px;        /* but 에 바짝 붙이기 */
      position: relative;
      top: -1.7273em;          /* -19px: 윗부분을 but 의 b 윗부분 높이에 맞춤 */
    }

    /* ===== 슬로건 ===== */
    .slogan {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 16px;
    }

    /* ===== 골드 버튼 공통 ===== */
    .cta-btn,
    .gold-btn {
      background: var(--gold);
      color: var(--navy);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: filter 0.2s, opacity 0.2s;
    }
    .cta-btn:hover,
    .gold-btn:hover {
      filter: brightness(1.2);  /* 마우스를 올리면 밝아짐 */
    }
    .gold-btn:disabled {
      opacity: 0.6;
      cursor: default;
      filter: none;
    }

    /* 랜딩의 Start Order 버튼 */
    .cta-btn {
      padding: 14px 40px;
      margin-top: 40px;
    }

    /* ===== 로그인 화면 배경 (아주 은은한 골드 빛) ===== */
    #screen-auth {
      background:
        radial-gradient(circle at 50% 40%, rgba(212,175,55,0.08), transparent 55%),
        var(--dark);
    }

    /* ===== 반투명 유리 패널 ===== */
    .glass-panel {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin-top: 28px;
      padding: 32px 28px 28px;
      background: rgba(12,16,24,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 16px;
      text-align: left;
    }

    /* 네 모서리의 짧은 골드 L자 꺾쇠 */
    .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 0 solid var(--gold);
      pointer-events: none;
    }
    .corner.tl { top: 8px;    left: 8px;  border-top-width: 2px;    border-left-width: 2px; }
    .corner.tr { top: 8px;    right: 8px; border-top-width: 2px;    border-right-width: 2px; }
    .corner.bl { bottom: 8px; left: 8px;  border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; }

    /* ===== 탭 (Sign In / Create Account) ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 12px 0;
      color: #8892a4;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab:hover { color: #fff; }
    .tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);  /* 선택된 탭은 골드 밑줄 */
    }

    /* ===== 입력 칸 ===== */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: var(--gold);  /* 포커스되면 골드 테두리 */
    }

    /* 패널 안 큰 버튼 (Enter / Create) */
    .gold-btn.full {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      font-size: 15px;
    }

    /* ===== 에러 / 안내 메시지 ===== */
    .auth-msg {
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      margin: 4px 0 4px;
    }
    .auth-msg.error { color: #ff6b6b; }       /* 빨간 글씨 */
    .auth-msg.info  { color: var(--gold); }   /* 안내는 골드 글씨 */

    /* ===== ← Back 링크 ===== */
    .back-link {
      margin-top: 24px;
      background: none;
      border: none;
      color: #8892a4;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    /* ===== 테두리 버튼 ===== */
    .outline-btn {
      background: none;
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 8px;
      color: var(--gold);
      padding: 12px 32px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .outline-btn:hover { background: rgba(212,175,55,0.1); }


    /* ================================================================
       Avatar Studio (Pet 탭)
       ================================================================ */
    .studio-simple.glass-panel {
      max-width: 440px;
      margin-top: 0;
      text-align: center;
    }
    .studio-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      text-align: left;
    }
    .studio-header > div { min-width: 0; }
    .studio-title {
      font-size: 22px;
      font-weight: 200;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .studio-title b { font-weight: 600; color: var(--gold); }
    .studio-nick {
      margin-top: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: #8892a4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .studio-nick::before { content: '@'; color: var(--gold); }
    .studio-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .studio-header-right .back-link { margin-top: 0; }

    /* 미리보기 (픽셀 2배 확대) */
    .studio-preview-box {
      display: flex;
      justify-content: center;
      padding: 14px 0;
      background: radial-gradient(circle at 50% 60%, rgba(212,175,55,0.12), transparent 70%);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
    }
    #studio-preview-canvas {
      width: 256px;
      height: 128px;
      max-width: 100%;
      image-rendering: pixelated;   /* 픽셀아트 확대해도 선명하게 */
    }

    /* 카테고리 탭 */
    .studio-tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0 10px;
    }
    .studio-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 6px 6px;
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #8892a4;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .studio-tab-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }
    .studio-tab-icon svg { width: 20px; height: 20px; }
    .studio-tab-label {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
    }
    .studio-tab.active {
      color: var(--gold);
      background: rgba(212,175,55,0.15);
      border-color: var(--gold);
    }

    /* 아이템 카드 (3열) */
    .studio-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .studio-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      aspect-ratio: 1 / 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .studio-card:hover { border-color: rgba(212,175,55,0.45); }
    .studio-card.selected {
      border: 2px solid var(--gold);
      background: rgba(212,175,55,0.06);
      box-shadow: 0 0 16px rgba(212,175,55,0.28);
    }
    .studio-card canvas {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
    }
    .studio-card-none {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #4a5366;
    }
    .studio-card-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #8892a4;
    }
    .studio-card.selected .studio-card-name { color: var(--gold); }
    .studio-card.locked { opacity: 0.4; cursor: not-allowed; }
    .price-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--gold);
      color: var(--navy);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .lock-icon {
      position: absolute;
      left: 8px;
      bottom: 6px;
      font-size: 13px;
    }
    .studio-note {
      margin: 14px 0 4px;
      font-size: 12px;
      line-height: 1.6;
      color: #8892a4;
    }

    /* ================================================================
       로그인 세션 (남은 시간 표시 / 5분 경고 팝업 / 만료 안내)
       ================================================================ */

    /* 남은 시간 표시: 시계 아이콘 + 52:13 + [+1h] */
    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      white-space: nowrap;
    }
    .session-badge svg { width: 13px; height: 13px; flex-shrink: 0; }
    .session-time { min-width: 38px; }
    .session-time.warn { color: #ff9f43; }          /* 10분 이하: 주황 */
    .session-time.danger {                          /* 5분 이하: 빨강 + 천천히 깜빡임 */
      color: #ff5c5c;
      animation: session-blink 1.6s ease-in-out infinite;
    }
    @keyframes session-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .session-extend {
      background: none;
      border: 1px solid rgba(212,175,55,0.6);
      border-radius: 999px;
      color: var(--gold);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 2px 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .session-extend:hover { background: rgba(212,175,55,0.12); }
    .session-extend:disabled { cursor: default; }

    /* Avatar Studio 머리말 오른쪽: 남은 시간 + Sign Out */
    .studio-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .studio-header-right .back-link { margin-top: 0; }


    /* 5분 경고 팝업 */
    .session-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(3,5,10,0.6);   /* 배경 살짝 어둡게 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .session-modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .session-modal .glass-panel {
      max-width: 360px;
      margin-top: 0;
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.3s ease;
    }
    .session-modal.open .glass-panel { transform: scale(1); }
    .session-modal-title {
      font-size: 18px;
      font-weight: 600;
    }
    .session-modal-text {
      margin-top: 8px;
      font-size: 13px;
      color: #8892a4;
    }
    .session-modal-countdown {
      margin: 18px 0 22px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 40px;
      font-weight: 300;
      color: #ff5c5c;
      letter-spacing: 2px;
    }
    .session-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .session-modal-actions .gold-btn,
    .session-modal-actions .outline-btn {
      width: 100%;
      height: 48px;
      font-size: 15px;
    }

    /* 랜딩 화면 안내 문구 (Session expired...) */
    .landing-notice {
      position: fixed;
      top: 28px;
      left: 50%;
      z-index: 150;
      transform: translate(-50%, -10px);
      max-width: calc(100% - 32px);
      padding: 12px 20px;
      background: rgba(12,16,24,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 10px;
      color: var(--gold);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .landing-notice.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }


    /* ================================================================
       게임 화면 (Phaser 2D 픽셀아트)
       ================================================================ */
    #screen-game {
      position: relative;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: #06090f;
    }
    #game-container {
      position: absolute;
      inset: 0;
      touch-action: none;   /* 손가락 드래그는 게임 조작(조이스틱)에 사용 */
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;   /* 픽셀아트 선명하게 */
    }

    /* 게임 화면에서는 하단 저작권 문구 숨김 */
    body:has(#screen-game.active) .footer { display: none; }


    /* ===== 하단 저작권 문구 (화면 아래 고정) ===== */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      opacity: 0.2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- ========== 1. 랜딩 화면 ========== -->
    <section class="screen" id="screen-landing">

      <!-- 로고 -->
      <div class="logo">
        <span class="logo-all">all</span>
        <span class="logo-a">A</span>
        <span class="logo-but">but</span>
        <span class="logo-um">5μm</span>
      </div>

      <!-- 슬로건 -->
      <p class="slogan">Precision Custom Abutment</p>

      <!-- 주문 시작 버튼 -->
      <button class="cta-btn" onclick="goStep(1)">Start Order</button>

    </section>


    <!-- ========== 2. 로그인 / 회원가입 화면 ========== -->
    <section class="screen" id="screen-auth">

      <!-- 작은 로고 (랜딩 로고의 절반 크기) -->
      <div class="logo logo-small">
        <span class="logo-all">all</span>
        <span class="logo-a">A</span>
        <span class="logo-but">but</span>
        <span class="logo-um">5μm</span>
      </div>

      <!-- 유리 패널 -->
      <div class="glass-panel">
        <!-- 네 모서리 꺾쇠 -->
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- 탭 -->
        <div class="tabs">
          <button type="button" class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
          <button type="button" class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- Sign In 폼 -->
        <form id="form-signin" onsubmit="handleSignIn(event)" novalidate>
          <div class="field">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" autocomplete="current-password">
          </div>
          <p class="auth-msg" id="signin-error"></p>
          <button type="submit" class="gold-btn full" id="signin-btn">Enter</button>
        </form>

        <!-- Create Account 폼 -->
        <form id="form-signup" onsubmit="handleSignUp(event)" novalidate style="display:none">
          <div class="field">
            <label for="signup-nickname">Nickname</label>
            <input type="text" id="signup-nickname" autocomplete="nickname">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="signup-password2">Confirm Password</label>
            <input type="password" id="signup-password2" autocomplete="new-password">
          </div>
          <p class="auth-msg" id="signup-error"></p>
          <button type="submit" class="gold-btn full" id="signup-btn">Create</button>
        </form>
      </div>

      <!-- 랜딩으로 돌아가기 -->
      <button class="back-link" onclick="showScreen('landing')">← Back</button>

    </section>


    <!-- ========== 3. Avatar Studio (Pet 탭 - 얼굴·머리·옷은 다음 단계) ========== -->
    <section class="screen" id="screen-avatar">
      <div class="glass-panel studio-simple">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="studio-header">
          <div>
            <h2 class="studio-title">Avatar <b>Studio</b></h2>
            <p class="studio-nick" id="studio-nickname"></p>
          </div>
          <div class="studio-header-right">
            <!-- 남은 세션 시간 (session.js 가 1초마다 갱신) -->
            <div class="session-badge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              <span class="session-time">--:--</span>
              <button type="button" class="session-extend" onclick="handleExtendClick(this)">+1h</button>
            </div>
            <button class="back-link" onclick="endSession('manual')">Sign Out</button>
          </div>
        </div>

        <!-- 픽셀 캐릭터 미리보기 (앞·왼쪽·오른쪽·뒤, 어깨 펫 포함) -->
        <div class="studio-preview-box">
          <canvas id="studio-preview-canvas" width="128" height="64"></canvas>
        </div>

        <!-- 카테고리 탭 (avatar-studio.js 가 채워요) -->
        <div class="studio-tabs" id="studio-tabs"></div>

        <!-- 아이템 카드 (avatar-studio.js 가 채워요) -->
        <div class="studio-items" id="studio-items"></div>

        <p class="studio-note">Face, hair and outfit editing is coming in the next update.</p>

        <p class="auth-msg" id="studio-error"></p>
        <button type="button" class="gold-btn full" id="studio-save-btn" onclick="saveAvatar()">Save &amp; Enter →</button>
      </div>
    </section>


    <!-- ========== 4. 게임 (Phaser 2D 픽셀아트 월드) ========== -->
    <section class="screen" id="screen-game">
      <!-- Phaser 가 이 안에 캔버스를 만들어요 (UI 도 Phaser 의 UIScene 이 그려요) -->
      <div id="game-container"></div>
    </section>


    <!-- ========== 5분 경고 팝업 ========== -->
    <div class="session-modal" id="session-modal" role="dialog" aria-modal="true" aria-labelledby="session-modal-title">
      <div class="glass-panel">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <h3 class="session-modal-title" id="session-modal-title">Session ending soon</h3>
        <p class="session-modal-text">You will be signed out in</p>
        <p class="session-modal-countdown" id="session-modal-countdown">05:00</p>

        <div class="session-modal-actions">
          <button type="button" class="gold-btn" onclick="handleModalExtend()">Extend 1 hour</button>
          <button type="button" class="outline-btn" onclick="endSession('manual')">Sign out</button>
        </div>
      </div>
    </div>

    <!-- 랜딩 안내 문구 (세션 만료 시 3초간 표시) -->
    <div class="landing-notice" id="landing-notice" role="status"></div>


    <!-- 하단 저작권 -->
    <footer class="footer">© 2026 allAbut. All rights reserved.</footer>

  </div>
